name: cd

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build


